<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pompom Child oyunları</title>
<meta name="description" content="Küçük çocuklar için dokunmalı tarayıcı oyunları: renk eşleme, hafıza, sayma ve daha fazlası.">
<style>
:root { --navy: #1e2a78; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: clamp(24px, 6vw, 64px) 16px;
  background: linear-gradient(#6fcde3, #bfeaf0 55%, #fdf6d8);
  background-attachment: fixed;
  color: var(--navy);
  font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
}
main { max-width: 760px; margin: 0 auto; }
h1 { margin: 0; font-size: clamp(30px, 7vw, 48px); font-weight: 800; line-height: 1.1; text-wrap: balance; }
p { margin: 12px 0 0; max-width: 46ch; font-size: clamp(16px, 3.6vw, 19px); font-weight: 600; line-height: 1.45; }
.list { margin-top: clamp(24px, 5vw, 40px); display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 14px;
  align-items: center;
  padding: 16px 18px;
  border: 4px solid var(--navy);
  border-radius: 24px;
  background: #fff;
  color: inherit;
  text-decoration: none;
  transition: transform 160ms var(--ease-out);
}
.card:active { transform: scale(0.97); }
.card:focus-visible { outline: 4px solid var(--navy); outline-offset: 4px; }
.dot { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--navy); }
.name { font-size: 20px; font-weight: 800; line-height: 1.2; }
.en { font-size: 15px; font-weight: 600; opacity: 0.8; }
@media (hover: hover) and (pointer: fine) { .card:hover { transform: translateY(-2px); } .card:hover:active { transform: scale(0.97); } }
@media (prefers-reduced-motion: reduce) { .card, .card:active, .card:hover { transition: none; transform: none; } }
</style>
</head>
<body>
<main>
  <h1>Pompom Child oyunları</h1>
  <p>Küçük çocuklar için dokunarak oynanan altı oyun. Reklam ve satın alma yok.</p>
  <nav class="list" aria-label="Oyunlar">
    <a class="card" href="ponpon-patlat/"><span class="dot" style="background:#FFC93C"></span><span class="name">Ponpon Patlat</span><span class="en" lang="en">Pop the Pompoms</span></a>
    <a class="card" href="renk-esle.html"><span class="dot" style="background:#FF6F61"></span><span class="name">Renk Eşle</span><span class="en" lang="en">Color Match</span></a>
    <a class="card" href="hafiza.html"><span class="dot" style="background:#A78BDA"></span><span class="name">Hafıza Kartları</span><span class="en" lang="en">Memory Cards</span></a>
    <a class="card" href="yakala.html"><span class="dot" style="background:#FF9A4D"></span><span class="name">Yün Yakala</span><span class="en" lang="en">Catch the Yarn</span></a>
    <a class="card" href="sirayi-tekrarla.html"><span class="dot" style="background:#5CC98B"></span><span class="name">Sırayı Tekrarla</span><span class="en" lang="en">Repeat the Pattern</span></a>
    <a class="card" href="say-dokun.html"><span class="dot" style="background:#2EC4C6"></span><span class="name">Say ve Dokun</span><span class="en" lang="en">Count and Tap</span></a>
  </nav>
</main>
</body>
</html>
